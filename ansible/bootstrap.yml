- hosts: 
    all
  become: True
  roles:
    - lusers
    - superusers

- hosts: 
    all
  become: True
  tasks:
  - name: Packages
    apt:
      name: "{{ item }}"
      install_recommends: no
    with_items:
      - git
      - etckeeper
  - name: Remove default pi user/pass
    user:
      name: pi
      state: absent
      remove: yes
      force: yes # in case some process still uses the user
